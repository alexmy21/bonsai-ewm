name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the stdlib-only controller
        run: pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          bonsai-ewm --help
          bonsai-ewm --health || true

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the two-repo build context
        run: |
          CTX=$(mktemp -d)
          echo "CTX=$CTX" >> "$GITHUB_ENV"
          cp -r "$GITHUB_WORKSPACE" "$CTX/bonsai-ewm"
          git clone --depth 1 https://github.com/alexmy21/ewm-state-machine.git "$CTX/ewm-state-machine"
      - name: Build the container image (podman if present, docker otherwise)
        run: |
          if command -v podman >/dev/null 2>&1; then C=podman; F="--format docker"; else C=docker; F=""; fi
          echo "building with $C"
          $C build $F \
            --ignorefile "$CTX/bonsai-ewm/container/.containerignore" \
            --build-arg EWM_SM_SRC=ewm-state-machine \
            --build-arg CONTROLLER_SRC=bonsai-ewm \
            -f "$CTX/bonsai-ewm/container/Containerfile" \
            -t bonsai-ewm:ci "$CTX"
      - name: Health check inside the image
        run: |
          if command -v podman >/dev/null 2>&1; then C=podman; else C=docker; fi
          $C run --rm bonsai-ewm:ci --health || true
